<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옷 입히기 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece7f7;--panel:#fff;--ink:#2b2540;--mute:#7a7396;--line:#d9d2ee;--acc:#3dbe9b;--accink:#06382c;--pop:#ff7a7a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a30;--panel:#2a2542;--ink:#f1edff;--mute:#a49dc4;--line:#433c66;--accink:#06382c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1a30;--panel:#2a2542;--ink:#f1edff;--mute:#a49dc4;--line:#433c66;--accink:#06382c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px}
main{max-width:860px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:28px;margin:0 0 4px;font-weight:400}
.sub{margin:0 0 18px;color:var(--mute)}
.game{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.stage{flex:0 1 300px;margin:0 auto;width:100%;max-width:320px}
#doll{width:100%;display:block;border-radius:28px;border:3px solid var(--ink);background:var(--panel)}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1}
.panel{flex:1 1 300px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px}
.gender{display:flex;gap:8px;margin-bottom:12px}
.pick{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mute)}
.pick input{width:46px;height:36px;border:2px solid var(--line);border-radius:10px;padding:0;background:none;cursor:pointer}
.sign{background:repeating-linear-gradient(90deg,var(--pop) 0 22px,#fff 22px 44px);border-radius:12px 12px 4px 4px;padding:10px 14px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:20px;box-shadow:0 6px 0 -2px rgba(0,0,0,.14)}
.sign b{background:var(--panel);color:var(--ink);padding:2px 14px;border-radius:999px;font-weight:400}
.sign small{background:var(--acc);color:var(--accink);padding:2px 10px;border-radius:999px;font-size:14px}
.tag{border-style:dashed;text-align:left}
.tag small{display:block;color:var(--mute);font-size:14px}
.rcpt{font-family:'Courier New',monospace;font-size:14px;background:#fffdf5;color:#2b2540;border:1px solid #d9d2ee;padding:8px 12px;margin:8px 0;border-radius:4px}
.rcpt div{display:flex;justify-content:space-between}
.rcpt .sum{border-top:1px dashed #2b2540;margin-top:4px;padding-top:4px}
.modes{display:flex;gap:8px;margin-bottom:16px}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;color:var(--mute);margin-bottom:8px}
.pick input[type=text]{width:auto;height:auto;flex:1;min-width:0;padding:8px 12px;font:inherit;color:var(--ink);background:var(--panel)}
.vip{background:#e8b04a;color:#3a2a00;border-radius:6px;padding:0 6px;font-size:14px;margin-right:6px}
.ctag{background:var(--acc);color:var(--accink)}
button:disabled{opacity:.45;cursor:not-allowed}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
.invl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--acc)}
.act small{color:var(--mute);font-size:14px}
.bubble{background:var(--bg);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:10px 14px;margin-bottom:12px}
.bubble p{margin:6px 0 0}
.res{border:2px dashed var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.res ul{margin:6px 0;padding:0;list-style:none}
.stars{font-size:24px;color:#e8b04a}
#shop .act{width:100%;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
button{font:inherit;color:var(--ink);cursor:pointer}
.tab{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
h2{font-size:16px;font-weight:400;color:var(--mute);margin:12px 0 8px}
.chips,.sw{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 14px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.act{border:2px solid var(--ink);background:var(--panel);border-radius:14px;padding:10px}
.act.pop{background:var(--pop);color:#3a0d0d}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.bounce{animation:b .35s}@keyframes b{50%{transform:scale(1.02) rotate(-.6deg)}}}
</style>
</head>
<body>
<main>
<h1>옷 입히기 게임</h1>
<p class="sub">머리부터 신발까지 골라서 꾸미거나, 가게에서 손님에게 옷을 추천해 보세요.</p>
<div class="modes" id="modes"></div>
<div class="game">
  <div class="stage">
    <svg id="doll" viewBox="0 0 240 400" role="img" aria-label="꾸미는 중인 캐릭터"></svg>
    <div class="row" id="acts">
      <button class="act pop" id="rnd">랜덤으로 입히기</button>
      <button class="act" id="rst">처음으로</button>
    </div>
  </div>
  <section class="panel">
    <div id="shop" hidden></div>
    <div class="gender" id="gender" role="group" aria-label="성별"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="opts"></div>
  </section>
</div>
</main>

  if(qs&&(c.label+nm).replace(/\s/g,'').indexOf(qs)<0)return;
  h+='<div class="srow"><span>'+c.label+' · '+nm+' <small>재고 '+stk(k,i)+'</small></span><button class="chip" data-ord="'+k+':'+i+'"'+(cash<unit(k,i)*3||stk(k,i)>=cap()?' disabled':'')+'>+3 · '+won(unit(k,i)*3)+'</button></div>'})});
 return h||'<p>검색 결과가 없어요.</p>';
}
function bindOrd(root){Array.prototype.forEach.call(root.querySelectorAll('[data-ord]'),function(b){b.onclick=function(){var p=b.getAttribute('data-ord').split(':');order(p[0],+p[1],3);refreshAll()}})}
function refreshAll(){renderShop();renderOpts()}
function renderManage(){
 var box=document.getElementById('opts'),L=SHOPS[shopLv-1];
 var h='<div class="res"><p>현금 <b>'+won(cash)+'</b></p></div><h2>가게</h2><p style="margin:0 0 8px">'+L.n+' · 하루 손님 +'+(shopLv-1)+'명 · 직원 '+staff.length+'/'+L.slots+(D.inv?' · 창고 '+cap()+'개':'')+'</p>';
 if(shopLv<SHOPS.length){var N=SHOPS[shopLv];h+='<button class="act" id="up" style="width:100%"'+(cash<N.cost?' disabled':'')+'>'+N.n+'(으)로 넓히기 · '+won(N.cost)+'<br><small>하루 손님 +1명, 직원 자리 '+N.slots+'명'+(D.inv?', 창고 '+[5,8,12,20][shopLv]+'개':'')+'</small></button>'}else h+='<p>가장 큰 가게예요!</p>';
 h+='<h2>직원</h2>';
 staff.forEach(function(s,i){var T=STAFF[s.t];h+='<div class="srow"><span>'+esc(s.name)+' ('+T.n+') · 월급 '+won(T.wage)+' · 하루 '+T.k+'명</span><button class="chip" data-fire="'+i+'">내보내기</button></div>'});
 h+='<div class="chips">'+STAFF.map(function(T,i){return'<button class="chip" data-hire="'+i+'"'+(cash<T.hire||staff.length>=L.slots?' disabled':'')+'>'+T.n+' 채용 '+won(T.hire)+'<small style="display:block">월급 '+won(T.wage)+' · 하루 '+T.k+'명 · 성공 '+Math.round(T.p*100)+'%</small></button>'}).join('')+'</div>';
 if(D.inv){
  h+='<h2>재고 (한 종류당 최대 '+cap()+'개)</h2><button class="act" id="fill" style="width:100%;margin-bottom:8px"'+(fillCost()?'':' disabled')+'>부족한 것 3개까지 채우기 · '+won(fillCost())+'</button><input id="invq" type="search" placeholder="옷 검색 (예: 후드, 신발, 코트)" value="'+esc(invQ)+'" style="width:100%;margin-bottom:8px;padding:8px 12px;font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px"><div class="invl">';
  h+=invRows();
  h+='</div>';
 }
 box.innerHTML=h;
 var q=function(s2,fn){Array.prototype.forEach.call(box.querySelectorAll(s2),fn)};
 q('#up',function(b){b.onclick=function(){var N=SHOPS[shopLv];if(cash<N.cost)return;cash-=N.cost;shopLv++;perDay=custCount();refreshAll()}});
 q('[data-hire]',function(b){b.onclick=function(){var t=+b.getAttribute('data-hire'),T=STAFF[t];if(cash<T.hire||staff.length>=SHOPS[shopLv-1].slots)return;cash-=T.hire;staff.push({t:t,name:NAMES[rnd(NAMES.length)]});refreshAll()}});
 q('[data-fire]',function(b){b.onclick=function(){staff.splice(+b.getAttribute('data-fire'),1);refreshAll()}});
 q('[data-ord]',function(b){b.onclick=function(){var p=b.getAttribute('data-ord').split(':');order(p[0],+p[1],3);refreshAll()}});
 q('#fill',function(b){b.onclick=function(){fillAll();refreshAll()}});
 q('#invq',function(i){i.oninput=function(){invQ=i.value;var l=box.querySelector('.invl');l.innerHTML=invRows();bindOrd(l)}});
}
function chk(){return cur.c.concat(cstyle?[['스타일 · '+cstyle.n,function(){return cstyle.r.filter(function(f){return f()}).length>=2}]]:[])}
function custCount(){return Math.max(3,Math.min(8,Math.round(5+(rating-3)*1.5)))+(shopLv-1)}
function vipP(){return Math.max(0,(rating-3)*.15)}
function goal(){return D.g0+(day-1)*D.gs}
function bud(){return Math.round(cur.b*D.bm*(isVip?2:1)*ctype.bm/1000)*1000}
function selectHtml(){
 return '<div class="sign"><b>'+esc(shopName)+'</b><small>오픈 준비</small></div><div class="bubble"><p>가게 이름을 정하고 난이도를 골라 주세요. 목표 매출을 모으면 클리어예요!</p></div><label class="pick" style="margin:0 0 12px">가게 이름 <input id="sname" type="text" maxlength="12" value="'+esc(shopName)+'" placeholder="우리 옷 가게"></label>'+DIFF.map(function(d,i){return'<button class="act" data-lv="'+i+'">'+d.n+' · 목표 '+won(d.target)+'<br><small>하루 목표 '+won(d.g0)+'부터 · '+(d.lives?'기회 '+d.lives+'번':'기회 무제한')+(d.inv?' · 재고 관리':'')+'</small></button>'}).join('');
}
function startGame(i){D=DIFF[i];day=1;dayN=0;daySales=0;sales=0;served=0;regs=[];lives=D.lives;last=-1;lastName='';rating=3;isVip=false;shopLv=1;cash=D.inv?300000:100000;staff=[];stock=initStock();warn='';perDay=custCount();newCustomer()}
function checkEnd(){
 if(!D||sales<D.target)return false;
 summary='<div class="res"><div class="stars">클리어!</div><p>'+D.n+' 난이도 목표 '+won(D.target)+'을 모았어요!</p><p>'+day+'일차 · 총 매출 '+won(sales)+' · 단골 '+regs.length+'명</p></div><button class="act pop" id="again">난이도 다시 고르기</button>';
 renderShop();return true;
}
function gameOver(){
 summary='<div class="res"><div class="stars">게임 오버</div><p>기회를 모두 잃었어요… '+D.n+' · '+day+'일차 · 총 매출 '+won(sales)+'</p></div><button class="act pop" id="again">난이도 다시 고르기</button>';
 renderShop();
}
function endDay(){
 var sr=runStaff();var ok=daySales>=goal(),bonus=ok?Math.round(goal()*0.1):0;
 sales+=bonus;cash+=bonus;res=null;if(checkEnd())return;if(!ok&&D.lives){lives--;if(lives<=0){gameOver();return}}
 summary='<div class="res"><div class="stars">'+(ok?'영업 성공!':'아쉬워요')+'</div><p>'+day+'일차 매출 '+won(daySales)+' / 목표 '+won(goal())+'</p>'+sr+'<p>'+(ok?'목표 달성 보너스 +'+won(bonus):'목표까지 '+won(goal()-daySales)+' 모자랐어요.'+(D.lives?' 남은 기회 '+lives+'번':''))+'</p></div><button class="act pop" id="nxt2">'+(ok?(day+1)+'일차 시작하기':'같은 날 다시 도전')+'</button>';
 renderShop();
}
function nextDay(){if(daySales>=goal())day++;dayN=0;daySales=0;summary=null;perDay=custCount();newCustomer()}
function setMode(m){
 mode=m;res=null;
 document.getElementById('shop').hidden=m!=='shop';
 document.getElementById('gender').style.display=m==='shop'?'none':'flex';
 document.getElementById('acts').style.display=m==='shop'?'none':'flex';
 renderModes();
 if(m==='shop'){newCustomer()}else{tab='hair';reset();renderGender();renderTabs();update()}
}
function renderModes(){
 var w=document.getElementById('modes');w.innerHTML='';
 [['play','꾸미기'],['shop','옷 가게']].forEach(function(p){var b=document.createElement('button');b.className='chip';b.textContent=p[1];
  b.setAttribute('aria-pressed',mode===p[0]);b.onclick=function(){if(mode!==p[0])setMode(p[0])};w.appendChild(b)});
}
renderModes();renderGender();renderTabs();draw();renderOpts();
</script>
</body>
</html>
